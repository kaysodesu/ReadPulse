<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ReadPulse</title>
  <style>
    :root {
      --bg: #0d0f14;
      --card: #161a22;
      --border: #242a36;
      --text: #e8ecf3;
      --muted: #8a93a6;
      --accent: #7c5cff;
      --accent-2: #22d3ee;
      --error: #f87171;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      font-size: 14px;
      padding: 18px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .logo {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: grid;
      place-items: center;
      box-shadow: 0 4px 14px rgba(124, 92, 255, 0.35);
    }

    .logo svg { width: 18px; height: 18px; }

    h1 { font-size: 16px; font-weight: 600; letter-spacing: 0.2px; }
    .tagline { font-size: 12px; color: var(--muted); }

    .stats {
      display: grid;
      gap: 8px;
      margin-bottom: 14px;
    }

    .stat {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
    }

    .stat-label { color: var(--muted); font-size: 13px; }

    .stat-value {
      font-size: 20px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      transition: opacity 0.2s ease;
    }

    .stat.highlight {
      border-color: rgba(124, 92, 255, 0.5);
      background: linear-gradient(135deg, rgba(124, 92, 255, 0.14), rgba(34, 211, 238, 0.08));
    }

    body.loading .stat-value { opacity: 0.35; }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 12px;
      font: inherit;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      background: linear-gradient(135deg, var(--accent), #5b8cff);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: filter 0.15s ease, transform 0.05s ease;
    }

    button:hover { filter: brightness(1.1); }
    button:active { transform: translateY(1px); }
    button:disabled { cursor: default; filter: saturate(0.6) brightness(0.9); }
    button:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }

    .spinner {
      display: none;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    body.loading .spinner { display: inline-block; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .message {
      min-height: 18px;
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      line-height: 1.4;
    }

    .message.error { color: var(--error); }
  </style>
</head>
<body>
  <header>
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="2 12 6 12 9 5 15 19 18 12 22 12"></polyline>
      </svg>
    </div>
    <div>
      <h1>ReadPulse</h1>
      <p class="tagline">How long is this page?</p>
    </div>
  </header>

  <section class="stats">
    <div class="stat">
      <span class="stat-label">Words</span>
      <span class="stat-value" id="words">–</span>
    </div>
    <div class="stat">
      <span class="stat-label">Characters</span>
      <span class="stat-value" id="chars">–</span>
    </div>
    <div class="stat highlight">
      <span class="stat-label">Reading time</span>
      <span class="stat-value" id="time">–</span>
    </div>
  </section>

  <button id="analyze" type="button">
    <span class="spinner" aria-hidden="true"></span>
    <span id="analyze-label">Analyze page</span>
  </button>

  <p class="message" id="message" role="status" aria-live="polite"></p>

  <script src="popup.js"></script>
</body>
</html>
